services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # POS_DB_USER: ${POS_DB_USER}
      # POS_DB_PASSWORD: ${POS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/init.sh:/docker-entrypoint-initdb.d/init.sh
      - ./infra/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 3
      # start_period: 20s

  core-pos:
    build:
      context: ./core-pos
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      # SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      # SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SCHAFFBAR_DS_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SCHAFFBAR_DS_USERNAME: ${POSTGRES_USER}
      SCHAFFBAR_DS_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: "production"
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  postgres_data:
