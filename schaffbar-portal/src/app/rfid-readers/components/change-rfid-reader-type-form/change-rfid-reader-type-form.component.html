<h2 mat-dialog-title>{{ 'rfidReaders.dialogs.changeRfidReaderType.title' | translate }}</h2>

<mat-divider />

<form [formRoot]="rfidReaderTypeForm" (submit)="saveRfidReaderType()">
  <mat-dialog-content>
    <div class="form-row">
      <div class="form-col">
        <mat-form-field class="full-width">
          <mat-label>{{ 'rfidReaders.shared.rfidReaderProperties.type' | translate }}</mat-label>
          <mat-select id="type" [formField]="rfidReaderTypeForm.type">
            @for (type of rfidReaderTypes; track type) {
              <mat-option [value]="type">
                {{ type | rfidReaderTypeKey | translate }}
              </mat-option>
            }
          </mat-select>
          <mat-error>
            <schbar-field-error
              [field]="rfidReaderTypeForm.type"
              label="rfidReaders.shared.rfidReaderProperties.type" />
          </mat-error>
        </mat-form-field>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton="outlined" type="button" [mat-dialog-close]="undefined">
      {{ 'shared.actions.cancel' | translate }}
    </button>
    <button matButton="filled" type="submit">
      {{ 'shared.actions.save' | translate }}
    </button>
  </mat-dialog-actions>
</form>
