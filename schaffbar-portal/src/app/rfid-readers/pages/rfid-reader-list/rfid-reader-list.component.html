<div class="rfid-reader-list-header">
  <h1>{{ 'rfidReaders.title' | translate }} ({{ rfidReadersCount() }})</h1>
  <button matIconButton color="primary" (click)="reloadRfidReaders()">
    <mat-icon>refresh</mat-icon>
  </button>
</div>

<div class="mat-elevation-z2">
  <table mat-table class="full-width-table" [dataSource]="dataSource()" matSort>
    <!-- Columns -->
    <ng-container matColumnDef="macAddress">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        {{ 'rfidReaders.tables.list.macAddressColumn' | translate }}
      </th>
      <td mat-cell *matCellDef="let row">{{ row.macAddress }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'rfidReaders.tables.list.typeColumn' | translate }}</th>
      <td mat-cell *matCellDef="let row">{{ row.type }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'shared.table.actionsColumn' | translate }}</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button type="button" color="warn" (click)="deleteRfidReaderDialog($event, row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Header and Row Declarations -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    #paginator
    [length]="rfidReadersCount()"
    [pageIndex]="0"
    [pageSize]="15"
    [pageSizeOptions]="[5, 10, 15, 20]"
    aria-label="Select page">
  </mat-paginator>
</div>
