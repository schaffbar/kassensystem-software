@if (detailsStore.isLoading()) {
  <mat-progress-bar mode="indeterminate" />
}
@if (detailsStore.hasLoadError()) {
  <p class="load-error">{{ 'shared.errors.loadFailed' | translate }}</p>
}

@if (detailsStore.rfidReader(); as rfidReader) {
  <schbar-page-header
    [title]="rfidReader.name || rfidReader.macAddress"
    [breadcrumbs]="[{ label: 'rfidReaders.title' | translate, link: rfidReadersLink }]">
    <button matButton="outlined" type="button" (click)="changeRfidReaderType()">
      <mat-icon>swap_horiz</mat-icon>
      {{ 'rfidReaders.pages.rfidReaderDetails.actions.changeType' | translate }}
    </button>
    <button
      matIconButton
      type="button"
      [attr.aria-label]="'shared.actions.reload' | translate"
      (click)="reloadRfidReader()">
      <mat-icon>refresh</mat-icon>
    </button>
  </schbar-page-header>

  <schbar-rfid-reader-detail-info [rfidReaderDetailInfo]="rfidReader" (rfidReaderChanged)="updateRfidReader($event)" />
}
