@if (detailsStore.isLoading()) {
  <mat-progress-bar mode="indeterminate" />
}
@if (detailsStore.hasLoadError()) {
  <p class="load-error">{{ 'shared.errors.loadFailed' | translate }}</p>
}

@if (detailsStore.tool(); as tool) {
  <div class="tool-detail-header">
    <div class="tool-detail-header__title">
      <h1>{{ tool.name }}</h1>
      <button matIconButton (click)="reloadTool()">
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
  </div>

  <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="center" dynamicHeight>
    <mat-tab [label]="'tools.tabGroups.toolDetails.detailsTab' | translate">
      <div class="tab-content">
        <schbar-tool-detail-tab-info />
      </div>
    </mat-tab>
    <mat-tab [label]="'tools.tabGroups.toolDetails.certificationsTab' | translate">
      <div class="tab-content">
        <schbar-tool-detail-tab-certifications />
      </div>
    </mat-tab>
    <mat-tab [label]="'tools.tabGroups.toolDetails.configurationTab' | translate">
      <div class="tab-content">
        <schbar-tool-detail-tab-configuration />
      </div>
    </mat-tab>
  </mat-tab-group>
}
