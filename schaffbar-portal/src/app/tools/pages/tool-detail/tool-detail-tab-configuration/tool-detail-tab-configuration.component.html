@if (rfidReaderAssignment(); as assignment) {
  <schbar-tool-rfid-reader-assignment
    [toolRfidReaderAssignment]="assignment"
    [rfidReaders]="rfidReaderOptions()"
    (rfidReaderChanged)="changeRfidReader($event)"
    (rfidReaderCleared)="clearRfidReader($event)" />
}
@if (detailsStore.tool(); as tool) {
  <schbar-tool-wlan-relais
    [toolWlanRelais]="tool"
    (wlanRelaisUpdated)="setWlanRelais($event)"
    (wlanRelaisCleared)="clearWlanRelais($event)" />
}
