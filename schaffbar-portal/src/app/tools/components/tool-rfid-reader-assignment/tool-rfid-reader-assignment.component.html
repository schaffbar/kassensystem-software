<h3 class="tool-rfid-reader-header">
  {{ 'tools.pages.toolDetails.headers.rfidReaderAssignment' | translate }}
  <button mat-icon-button type="button" (click)="updateRfidReader()" [disabled]="!readonly()">
    <mat-icon>edit</mat-icon>
  </button>
</h3>

<form [formGroup]="rfidReaderForm" class="tool-rfid-reader-content">
  <div class="row">
    <div class="col">
      <mat-form-field class="full-width" [floatLabel]="'always'" [hideRequiredMarker]="true">
        <mat-label>{{ 'tools.shared.toolProperties.rfidReader' | translate }}</mat-label>
        <mat-select id="rfidReaderId" formControlName="rfidReaderId">
          @for (rfidReader of rfidReaders(); track rfidReader.id) {
            <mat-option [value]="rfidReader.id">{{ rfidReader.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  @if (!this.readonly()) {
    <div class="tool-rfid-reader-actions">
      <button mat-stroked-button mat-dialog-close (click)="onCancel()">
        {{ 'shared.dialogs.actions.edit.cancel' | translate }}
      </button>
      <button mat-flat-button color="primary" type="submit" (click)="onSave()">
        {{ 'shared.dialogs.actions.edit.confirm' | translate }}
      </button>
    </div>
  }
</form>
