<h3 class="tool-info-header">
  {{ 'tools.pages.toolDetails.headers.toolInformation' | translate }}
  <button mat-icon-button type="button" aria-label="Edit tool" (click)="updateTool()" [disabled]="!readonly()">
    <mat-icon>edit</mat-icon>
  </button>
</h3>

<form [formGroup]="toolForm" class="tool-info-content">
  <div class="row">
    <div class="col">
      <mat-form-field class="full-width" [floatLabel]="'always'" [hideRequiredMarker]="true">
        <mat-label>{{ 'tools.shared.toolProperties.name' | translate }}</mat-label>
        <input id="name" matInput formControlName="name" [readonly]="readonly()" />
      </mat-form-field>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <mat-form-field class="full-width" [floatLabel]="'always'" [hideRequiredMarker]="true">
        <mat-label>{{ 'tools.shared.toolProperties.description' | translate }}</mat-label>
        <input id="description" matInput formControlName="description" [readonly]="readonly()" />
      </mat-form-field>
    </div>
  </div>

  @if (!this.readonly()) {
    <div class="tool-info-actions">
      <button mat-stroked-button mat-dialog-close (click)="onCancel()">
        {{ 'shared.dialogs.actions.edit.cancel' | translate }}
      </button>
      <button mat-flat-button color="primary" type="submit" (click)="onSave()">
        {{ 'shared.dialogs.actions.edit.confirm' | translate }}
      </button>
    </div>
  }
</form>
