<section class="attention" aria-labelledby="attention-title">
  <h2 id="attention-title">
    <mat-icon aria-hidden="true">warning</mat-icon>
    {{ 'dashboard.attention.title' | translate: { count: items().length } }}
  </h2>
  <ul>
    @for (line of lines(); track line.kind) {
      <li [class]="line.kind">
        <span>{{ line.messageKey | translate: line.params }}</span>
        <a [routerLink]="line.link">
          {{ line.linkKey | translate }}
          <mat-icon aria-hidden="true">arrow_forward</mat-icon>
        </a>
      </li>
    }
  </ul>
</section>
