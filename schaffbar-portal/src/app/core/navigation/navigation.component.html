<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="sidebar"
    fixedInViewport
    [attr.role]="isHandset() ? 'dialog' : null"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()">
    <nav class="sidebar-nav" [attr.aria-label]="'sidebar.label' | translate">
      <a class="brand" routerLink="dashboard" (click)="closeMenuOnHandset(drawer)">
        <img class="brand-logo" src="images/schaffbar-logo.png" alt="SchaffBar" width="180" height="43" />
        <span class="brand-subtitle">{{ 'sidebar.subtitle' | translate }}</span>
      </a>

      @for (group of menuGroups; track group.name) {
        <div class="nav-group">
          <span class="nav-group-title">{{ group.name | translate }}</span>
          @for (item of group.items; track item.route) {
            <a
              class="nav-link"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLink]="item.route"
              (click)="closeMenuOnHandset(drawer)">
              <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
              <span>{{ item.name | translate }}</span>
            </a>
          }
        </div>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content>
    @if (isHandset()) {
      <header class="mobile-bar">
        <button type="button" matIconButton [attr.aria-label]="'sidebar.openMenu' | translate" (click)="drawer.open()">
          <mat-icon>menu</mat-icon>
        </button>
        <img class="mobile-logo" src="images/schaffbar-logo.png" alt="SchaffBar" width="120" height="29" />
      </header>
    }

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
