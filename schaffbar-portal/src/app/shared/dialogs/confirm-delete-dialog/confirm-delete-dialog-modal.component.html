@let currentViewModel = viewModel();

<h2 mat-dialog-title>{{ currentViewModel.title | translate }}</h2>

<mat-dialog-content>
  {{ currentViewModel.message | translate }}
  @if (currentViewModel.entity) {
    <span>({{ currentViewModel.entity }})</span>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <button matButton="outlined" type="button" cdkFocusInitial (click)="cancelled.emit()">
    {{ 'shared.dialogs.confirmDelete.actions.cancel' | translate }}
  </button>
  <button class="danger-button" matButton="filled" type="button" (click)="confirmed.emit()">
    {{ currentViewModel.confirmLabel | translate }}
  </button>
</mat-dialog-actions>
