<h2 mat-dialog-title>Confirm Deletion</h2>

<mat-dialog-content>
  {{ data.message }}
  @if (!!data.username) {
    <span>({{ data.username }})</span>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-flat-button [mat-dialog-close]="true" color="danger">Delete</button>
  <button mat-button [mat-dialog-close]="false" cdkFocusInitial>Cancel</button>
  <!-- <button mat-button [mat-dialog-close]="false" cdkFocusInitial (click)="onCancel()">Cancel</button> -->
</mat-dialog-actions>
