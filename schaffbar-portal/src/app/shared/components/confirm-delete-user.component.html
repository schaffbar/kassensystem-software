<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  {{ data.message }}
  @if (!!data.entity) {
    <span>({{ data.entity }})</span>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-stroked-button [mat-dialog-close]="true" color="warn">
    {{ 'shared.dialogs.delete.confirm' | translate }}
  </button>
  <button mat-stroked-button [mat-dialog-close]="false" cdkFocusInitial>
    {{ 'shared.dialogs.delete.cancel' | translate }}
  </button>
  <!-- <button mat-button [mat-dialog-close]="false" cdkFocusInitial (click)="onCancel()">Cancel</button> -->
</mat-dialog-actions>
