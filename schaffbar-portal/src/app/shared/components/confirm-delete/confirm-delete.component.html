<h2 mat-dialog-title>{{ data.title | translate }}</h2>

<mat-dialog-content>
  {{ data.message | translate }}
  @if (data.entity) {
    <span>({{ data.entity }})</span>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <!-- cdkFocusInitial on cancel: an accidental Enter must not confirm a destructive action -->
  <button matButton="outlined" [mat-dialog-close]="undefined" cdkFocusInitial>
    {{ 'shared.dialogs.actions.delete.cancel' | translate }}
  </button>
  <button class="danger-button" matButton="filled" [mat-dialog-close]="true">
    {{ data.confirmLabel ?? 'shared.dialogs.actions.delete.confirm' | translate }}
  </button>
</mat-dialog-actions>
