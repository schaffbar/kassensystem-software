<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  {{ data.message }}
  @if (data.entity) {
    <span>({{ data.entity }})</span>
  }
</mat-dialog-content>

<mat-dialog-actions>
  <!-- cdkFocusInitial on cancel: an accidental Enter must not confirm a destructive action -->
  <button mat-stroked-button [mat-dialog-close]="undefined" cdkFocusInitial>
    {{ 'shared.dialogs.actions.delete.cancel' | translate }}
  </button>
  <button mat-stroked-button [mat-dialog-close]="true">
    {{ data.confirmLabel ?? ('shared.dialogs.actions.delete.confirm' | translate) }}
  </button>
</mat-dialog-actions>
