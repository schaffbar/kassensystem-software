@if (openSession(); as session) {
  <schbar-user-open-session [userOpenSession]="session" />
} @else {
  <schbar-empty-state
    class="card"
    icon="event_available"
    [title]="'users.pages.openSession.empty.title' | translate"
    [message]="'users.pages.openSession.empty.message' | translate" />
}
