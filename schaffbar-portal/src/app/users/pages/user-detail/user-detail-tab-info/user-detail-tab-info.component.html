@if (detailsStore.user(); as user) {
  <div>
    <schbar-user-contact class="user-info-section" [userContact]="user" (contactChanged)="updateUserContact($event)" />
    <schbar-user-address class="user-info-section" [userAddress]="user" (addressChanged)="updateUserAddress($event)" />
  </div>
  <schbar-user-tool-certifications
    [certifications]="certificationRows()"
    (certificationPaused)="pauseToolCertification($event)"
    (certificationReactivated)="reactivateToolCertification($event)"
    (certificationRevoked)="revokeToolCertification($event)" />
}
