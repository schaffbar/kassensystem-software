@if (detailsStore.isLoading()) {
  <mat-progress-bar mode="indeterminate" />
}
@if (detailsStore.hasLoadError()) {
  <p class="load-error">{{ 'shared.errors.loadFailed' | translate }}</p>
}

@if (detailsStore.user(); as user) {
  <schbar-user-detail-header
    [userDetailHeader]="user"
    [rfidTagAssignment]="detailsStore.rfidTagAssignment()"
    (edit)="updateUser()"
    (reload)="reloadUser()"
    (assignRfidTag)="onAssignRfidTag($event)"
    (unassignRfidTag)="onUnassignRfidTag($event)" />

  <mat-tab-group
    mat-stretch-tabs="false"
    mat-align-tabs="center"
    dynamicHeight
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="selectedTabIndex.set($event)">
    <mat-tab [label]="'users.tabGroups.userDetails.detailsTab' | translate">
      <div class="tab-content tab-content--split">
        <div>
          <schbar-user-contact
            class="user-info-section"
            [userContact]="user"
            (contactChanged)="onContactChanged($event)" />
          <schbar-user-address
            class="user-info-section"
            [userAddress]="user"
            (addressChanged)="onAddressChanged($event)" />
        </div>
        <schbar-user-tool-certifications
          [certifications]="certificationRows()"
          (pauseCertification)="onPauseCertification($event)"
          (reactivateCertification)="onReactivateCertification($event)"
          (revokeCertification)="onRevokeCertification($event)" />
      </div>
    </mat-tab>
    <mat-tab [label]="'users.tabGroups.userDetails.openSessionTab' | translate">
      <div class="tab-content">
        <schbar-user-open-session [userId]="user.id" />
      </div>
    </mat-tab>
  </mat-tab-group>
}
