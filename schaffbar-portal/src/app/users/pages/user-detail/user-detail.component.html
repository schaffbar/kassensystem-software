@if (detailsStore.isLoading()) {
  <mat-progress-bar mode="indeterminate" />
}
@if (detailsStore.hasLoadError()) {
  <p class="load-error">{{ 'shared.errors.loadFailed' | translate }}</p>
}

@if (detailsStore.user(); as user) {
  <schbar-user-detail-header
    [userDetailHeader]="user"
    [rfidTagAssignment]="detailsStore.rfidTagAssignment()"
    (editRequested)="updateUser()"
    (reloadRequested)="reloadUser()"
    (rfidTagAssigned)="assignRfidTag($event)"
    (rfidTagUnassigned)="unassignRfidTag($event)" />

  <mat-tab-group
    mat-stretch-tabs="false"
    mat-align-tabs="center"
    dynamicHeight
    [selectedIndex]="selectedTabIndex()"
    (selectedIndexChange)="selectedTabIndex.set($event)">
    <mat-tab [label]="'users.tabGroups.userDetails.detailsTab' | translate">
      <div class="tab-content">
        <schbar-user-detail-tab-info />
      </div>
    </mat-tab>
    <mat-tab [label]="'users.tabGroups.userDetails.openSessionTab' | translate">
      <div class="tab-content">
        <schbar-user-detail-tab-session [userId]="user.id" />
      </div>
    </mat-tab>
  </mat-tab-group>
}
