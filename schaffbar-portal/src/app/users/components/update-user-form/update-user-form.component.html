<h2 mat-dialog-title>{{ 'users.dialogs.editUser.title' | translate }}</h2>

<mat-divider />

<form [formRoot]="userForm" (submit)="onSave()">
  <mat-dialog-content>
    <div class="form-row">
      <div class="form-col">
        <mat-form-field class="full-width">
          <mat-label>{{ 'users.shared.userProperties.firstName' | translate }}</mat-label>
          <input id="firstName" matInput [formField]="userForm.firstName" />
          <mat-error>
            <schbar-field-error [field]="userForm.firstName" label="users.shared.userProperties.firstName" />
          </mat-error>
        </mat-form-field>
      </div>
      <div class="form-col">
        <mat-form-field class="full-width">
          <mat-label>{{ 'users.shared.userProperties.lastName' | translate }}</mat-label>
          <input id="lastName" matInput [formField]="userForm.lastName" />
          <mat-error>
            <schbar-field-error [field]="userForm.lastName" label="users.shared.userProperties.lastName" />
          </mat-error>
        </mat-form-field>
      </div>
    </div>
    <div class="form-row">
      <div class="form-col">
        <mat-form-field class="full-width">
          <mat-label>{{ 'users.shared.userProperties.dateOfBirth' | translate }}</mat-label>
          <input
            id="dateOfBirth"
            matInput
            [formField]="userForm.dateOfBirth"
            [min]="minDate"
            [max]="maxDate"
            [matDatepicker]="picker" />
          <mat-error>
            <schbar-field-error [field]="userForm.dateOfBirth" label="users.shared.userProperties.dateOfBirth" />
          </mat-error>
          <mat-datepicker-toggle matIconSuffix [for]="picker" />
          <mat-datepicker #picker startView="multi-year" />
        </mat-form-field>
      </div>
      <div class="form-col">
        <mat-checkbox [formField]="userForm.clubMember">
          {{ 'users.shared.userProperties.clubMember' | translate }}
        </mat-checkbox>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton="outlined" type="button" [mat-dialog-close]="undefined">
      {{ 'users.dialogs.editUser.actions.cancel' | translate }}
    </button>
    <button matButton="filled" type="submit">
      {{ 'users.dialogs.editUser.actions.confirm' | translate }}
    </button>
  </mat-dialog-actions>
</form>
