<h3 class="contact-header">
  {{ 'users.pages.userDetails.headers.contactInformation' | translate }}
  <button matIconButton type="button" aria-label="Edit contact" (click)="onEdit()" [disabled]="isEditing()">
    <mat-icon>edit</mat-icon>
  </button>
</h3>

<form [formRoot]="contactForm" (submit)="onSave()">
  <div class="form-row">
    <div class="form-col">
      <mat-form-field class="full-width" floatLabel="always" [hideRequiredMarker]="true">
        <mat-label>{{ 'users.shared.userProperties.email' | translate }}</mat-label>
        <input id="email" matInput [formField]="contactForm.email" />
        <mat-error>
          <schbar-field-error [field]="contactForm.email" label="users.shared.userProperties.email" />
        </mat-error>
      </mat-form-field>
    </div>
  </div>
  <div class="form-row">
    <div class="form-col">
      <mat-form-field class="full-width" floatLabel="always" [hideRequiredMarker]="true">
        <mat-label>{{ 'users.shared.userProperties.phone' | translate }}</mat-label>
        <input id="phone" matInput [formField]="contactForm.phone" />
      </mat-form-field>
    </div>
  </div>

  @if (isEditing()) {
    <div class="form-actions">
      <button matButton="outlined" type="button" (click)="onCancel()">
        {{ 'shared.dialogs.actions.edit.cancel' | translate }}
      </button>
      <button matButton="filled" type="submit">
        {{ 'shared.dialogs.actions.edit.confirm' | translate }}
      </button>
    </div>
  }
</form>
